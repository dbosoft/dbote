include:
  - ../../docker-compose.yaml

services:
  basicidentityprovider:
    build:
      context: ../../src/workers/src/Dbosoft.Bote.BasicIdentityProvider
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/.well-known/jwks.json"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      "BasicIdentityProvider__Authority": "http://basicidentityprovider"
      "BasicIdentityProvider__Audience": "http://dbote-worker/api"
      "AzureWebJobsStorage": "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      "FUNCTIONS_WORKER_RUNTIME": "dotnet-isolated"
      "AzureWebJobsSecretStorageType": memory

  controller:
    depends_on:
      dbote-worker:
        condition: service_healthy
    build:
      context: ./Dbosoft.Bote.Samples.LoadTest.Controller
    ports:
      - "5010:8080"
    environment:
      "ASPNETCORE_URLS": "http://+:8080"
      "dbote__Cloud__Servicebus__Connection": "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      "dbote__Cloud__ServiceBus__Queues__Cloud": "bote-sample-loadtest-cloud"
      "dbote__Cloud__ServiceBus__Queues__CloudIncoming": "bote-sample-loadtest-cloud-incoming"
      "dbote__Cloud__ServiceBus__Queues__Clients": "bote-sample-loadtest-clients"
      "dbote__Cloud__ServiceBus__Queues__Error": "bote-sample-loadtest-error"
      "dbote__Cloud__Storage__Connection": "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
      "LoadTest__Tenant": "load"
      "LoadTest__BroadcastIntervalSeconds": "10"

  dbote-worker:
    build:
      context: ../../src/workers/src/Dbosoft.Bote.BoteWorker
    depends_on:
      servicebus-health:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/admin/host/status?code=master-secret"]
      interval: 5s
      timeout: 5s
      retries: 5
    configs:
      - source: azfunctions-secrets
        target: /azure-functions-host/Secrets/host.json
    environment:
      "AzureWebJobsStorage": "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      "FUNCTIONS_WORKER_RUNTIME": "dotnet-isolated"
      "AzureWebJobsSecretStorageType": files
      "dbote__Worker__Storage__Connection": "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      "dbote__Worker__Storage__Prefix": "bote-sample-loadtest"
      "dbote__Worker__ServiceBus__Connection": "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      "dbote__Worker__ServiceBus__Queues__Cloud": "bote-sample-loadtest-cloud"
      "dbote__Worker__ServiceBus__Queues__CloudIncoming": "bote-sample-loadtest-cloud-incoming"
      "dbote__Worker__ServiceBus__Queues__Clients": "bote-sample-loadtest-clients"
      "dbote__Worker__ServiceBus__Queues__Error": "bote-sample-loadtest-error"
      "dbote__Worker__ServiceBus__Queues__Events": "bote-sample-loadtest-events"
      "dbote__Worker__SignalR__Connection": "Endpoint=http://signalr;Port=8888;AccessKey=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGH;Version=1.0;"
      "dbote__Worker__OpenId__Authority": "http://basicidentityprovider"
      "dbote__Worker__OpenId__JwksUri": "http://basicidentityprovider/api/.well-known/jwks.json"
      "dbote__Worker__OpenId__Audience": "http://dbote-worker/api"
      "dbote__Worker__OpenId__RequiredScope": "bote"

  edgeload:
    depends_on:
      dbote-worker:
        condition: service_healthy
    build:
      context: ./Dbosoft.Bote.Samples.LoadTest.EdgeLoad
    environment:
      "LoadTest__EdgeCount": "${LOADTEST_EDGES:-30}"
      "LoadTest__Tenant": "load"
      "LoadTest__Endpoint": "http://dbote-worker/api"
      "LoadTest__IdpUrl": "http://basicidentityprovider"
      "LoadTest__ControllerUrl": "http://controller:8080"
      "LoadTest__Authority": "http://basicidentityprovider"
      "LoadTest__Scope": "bote"
      "LoadTest__Queues__Cloud": "bote-sample-loadtest-cloud"
      "LoadTest__Queues__Clients": "bote-sample-loadtest-clients"
      "LoadTest__Queues__Error": "bote-sample-loadtest-error"
      "LoadTest__SmallIntervalMs": "2000"
      "LoadTest__SmallBytes": "2048"
      "LoadTest__LargeEveryN": "50"
      "LoadTest__LargeBytes": "262144"
      "LoadTest__StartupStaggerMs": "100"

configs:
  azfunctions-secrets:
    content: |
      {
        "masterKey": { "name": "master", "value": "master-secret", "encrypted": false },
        "functionKeys": [ { "name": "default", "value": "default-secret", "encrypted": false } ],
        "systemKeys": [ { "name": "signalr_extension", "value": "signalr-secret", "encrypted": false } ]
      }
