name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Dbote.sln

      - name: Build
        run: dotnet build Dbote.sln -c Release --no-restore

      - name: Unit tests
        run: |
          dotnet test test/Dbosoft.Bote.Rebus.Tests/Dbosoft.Bote.Rebus.Tests.csproj -c Release --no-build
          dotnet test test/Dbosoft.Bote.Client.KeyGenerator.Tests/Dbosoft.Bote.Client.KeyGenerator.Tests.csproj -c Release --no-build

      # Integration tests use Testcontainers to start a real Azurite. GitHub-hosted Linux
      # runners have Docker available, so no DOCKER_HOST / Ryuk overrides are needed (unlike
      # the local Podman setup documented in test/README.md).
      - name: Integration tests (Testcontainers/Azurite)
        run: dotnet test test/Dbosoft.Bote.Rebus.IntegrationTests/Dbosoft.Bote.Rebus.IntegrationTests.csproj -c Release --no-build
