name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The repo's nuget.config lists private dbosoft Azure DevOps feeds that require auth and
      # return 401 on CI. No project actually references a private package (all are on
      # nuget.org), so disable those sources and restore from nuget.org only.
      - name: Use nuget.org only
        run: |
          dotnet nuget disable source Library
          dotnet nuget disable source Public

      # Scoped to the test projects (which pull in the worker, client transport and
      # integration libraries transitively) rather than the whole solution, so the samples
      # and benchmark projects don't gate the build.
      - name: Unit tests
        run: |
          dotnet test test/Dbosoft.Bote.Rebus.Tests/Dbosoft.Bote.Rebus.Tests.csproj -c Release
          dotnet test test/Dbosoft.Bote.Client.KeyGenerator.Tests/Dbosoft.Bote.Client.KeyGenerator.Tests.csproj -c Release

      # Integration tests use Testcontainers to start a real Azurite. GitHub-hosted Linux
      # runners have Docker available, so no DOCKER_HOST / Ryuk overrides are needed (unlike
      # the local Podman setup documented in test/README.md).
      - name: Integration tests (Testcontainers/Azurite)
        run: dotnet test test/Dbosoft.Bote.Rebus.IntegrationTests/Dbosoft.Bote.Rebus.IntegrationTests.csproj -c Release
