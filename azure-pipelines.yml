# Builds the bote libraries (src/) and pushes them to the dbosoft Public feed.
# Runs on main and on release tags (v*): a main build publishes X.Y.Z-ci.<n>, a tag the version in
# its name. Pull requests are checked by the GitHub workflow (.github/workflows/ci.yml).
trigger:
  branches:
    include:
      - main
      - refs/tags/v*

pr: none

# Linux: the integration tests start Azurite in Docker (Testcontainers).
pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  solution: 'Dbote.sln'
  # A tag build checks out a detached HEAD; GitVersion 6 must be bypassed there (see below).
  isTagBuild: $[ startsWith(variables['Build.SourceBranch'], 'refs/tags/v') ]

steps:
- checkout: self
  fetchDepth: 0          # GitVersion needs the full history
  clean: true

- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: sdk
    version: '10.0.x'

# nuget.config lists the private dbosoft feeds next to nuget.org.
- task: NuGetAuthenticate@1
  displayName: Authenticate to the dbosoft feeds

# On a detached-HEAD tag build GitVersion 6 relabels a pre-release tag to the branch's 'ci'
# label (GitVersion #4534), so tag builds take the version verbatim from the tag name.
- task: gitversion/setup@3
  displayName: Install GitVersion
  condition: ne(variables['isTagBuild'], 'True')
  inputs:
    versionSpec: '6.7.x'

- task: gitversion/execute@3
  displayName: Execute GitVersion
  condition: ne(variables['isTagBuild'], 'True')
  inputs:
    configFilePath: 'gitversion.yml'

- pwsh: |
    $v = '$(GitVersion.SemVer)'
    Write-Host "Package version (branch build): $v"
    Write-Host "##vso[task.setvariable variable=packageVersion]$v"
    Write-Host "##vso[build.updatebuildnumber]$v"
  displayName: Resolve version from GitVersion
  condition: ne(variables['isTagBuild'], 'True')

- pwsh: |
    $v = "$env:BUILD_SOURCEBRANCH" -replace '^refs/tags/v', ''
    Write-Host "Package version (tag build): $v"
    Write-Host "##vso[task.setvariable variable=packageVersion]$v"
    Write-Host "##vso[build.updatebuildnumber]$v"
  displayName: Resolve version from tag
  condition: eq(variables['isTagBuild'], 'True')

- task: DotNetCoreCLI@2
  displayName: dotnet build
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) -p:Version=$(packageVersion)'

- task: DotNetCoreCLI@2
  displayName: dotnet test
  inputs:
    command: test
    projects: 'test/Dbosoft.Bote.*Tests/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build'
    publishTestResults: true

- task: DotNetCoreCLI@2
  displayName: dotnet pack
  inputs:
    command: pack
    packagesToPack: 'src/**/*.csproj'
    nobuild: true
    configuration: '$(buildConfiguration)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    buildProperties: 'Version=$(packageVersion)'

- task: PublishBuildArtifacts@1
  displayName: Publish package artifacts
  inputs:
    ArtifactName: build-packages

# dotnet-based push (not NuGetCommand@2, whose NuGet.exe needs mono — absent on Ubuntu 24.04+).
- task: DotNetCoreCLI@2
  displayName: Push to the Public feed
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: internal
    publishVstsFeed: '59a3608a-9bed-4cb4-9467-6efaaa3cbef5/1e425ef4-e3a0-4927-b4c0-2beff753cb88'
